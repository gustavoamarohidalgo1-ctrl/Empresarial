# Alternativa a scripts/db.sh para quien tenga Docker.
# Levanta PostgreSQL 18 con la misma configuración que espera el perfil "dev".
#   docker compose up -d
services:
  postgres:
    image: postgres:18.0
    container_name: siga-sp-postgres
    environment:
      POSTGRES_DB: siga_sp
      POSTGRES_USER: siga
      POSTGRES_PASSWORD: siga-dev-local
      TZ: UTC
    ports:
      - "127.0.0.1:5433:5432"   # solo accesible desde este equipo
    volumes:
      - siga-sp-datos:/var/lib/postgresql
volumes:
  siga-sp-datos:

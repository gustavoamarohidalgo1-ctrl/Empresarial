# =====================================================================
# SIGA-SP · Configuración base (equivalente a producción).
# Los secretos y la conexión a la BD llegan por variables de entorno (RNF19).
# Para desarrollo local usa el perfil "dev" (application-dev.yml).
# =====================================================================
spring:
  application:
    name: siga-sp
  datasource:
    url: ${SIGASP_DB_URL}
    username: ${SIGASP_DB_USER}
    password: ${SIGASP_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Las colecciones perezosas (versiones, eventos, pre-check-ins) de varias citas cargadas en
        # la misma sesión se inicializan juntas, en una sola consulta por colección (evita el N+1
        # del panel del operador).
        default_batch_fetch_size: 64
  web:
    resources:
      # Solo se sirve el build del SPA (classpath:/static). La caché de cada archivo la define
      # RecursosWebConfig: inmutable con hash; no-cache + ETag para index.html y el resto.
      static-locations: classpath:/static/
  flyway:
    locations: classpath:db/migration
  modulith:
    # Moments no se usa. Si se activa, su @EnableScheduling arranca las tareas @Scheduled aunque
    # sigasp.tareas.habilitadas=false (así ocurría en las pruebas).
    moments:
      enabled: false
    events:
      # El esquema lo crea Flyway (V1). Al reiniciar se republican los eventos no completados.
      jdbc:
        schema-initialization:
          enabled: false
      republish-outstanding-events-on-restart: true
  jackson:
    time-zone: UTC

server:
  port: 8080
  # gzip en Tomcat para texto (HTML, CSS, JS, JSON y SVG). No anula Cache-Control y agrega
  # "Vary: Accept-Encoding". Las fuentes woff2 ya vienen comprimidas y no se recomprimen.
  compression:
    enabled: true
    min-response-size: 1KB
    mime-types:
      - text/html
      - text/css
      - text/javascript
      - application/javascript
      - application/json
      - application/problem+json
      - image/svg+xml
      - text/plain
      - application/manifest+json
      - image/x-icon
      - image/vnd.microsoft.icon
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: 30m
      cookie:
        name: SIGASP_SESSION
        http-only: true
        secure: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

sigasp:
  reloj:
    ajustable: false
  tareas:
    habilitadas: true
  demo:
    habilitado: false
  reglas:
    llegada-antes: PT60M
    llegada-despues: PT30M
    zona-horaria: America/Lima
    intervalo-cierre: PT1M
    # Anticipación mínima para reservar: la disponibilidad y la reserva excluyen los horarios que empiezan
    # antes de ahora + este valor (docs/reglas-dominio.md, «Reserva de una cita nueva»).
    anticipacion-reserva: PT2H
  notificaciones:
    anticipacion-recordatorio: PT24H
    intervalo: PT5M
  eventos:
    reintentar-despues-de: PT5M
    intervalo-reintento: PT5M
  seguridad:
    login:
      max-intentos: 5
      ventana: PT15M
      bloqueo: PT15M
    # Límites por IP y por correo (la IP depende de server.forward-headers-strategy: ver docs/despliegue.md).
    registro:
      max-por-ip: 5
      ventana: PT1H
    recuperacion:
      max-solicitudes: 5
      ventana: PT15M
  privacidad:
    # Versión vigente de la política de privacidad: se guarda en paciente.privacidad_version al registrarse.
    version: "1.0"

logging:
  pattern:
    correlation: "[%X{requestId:-}] "
